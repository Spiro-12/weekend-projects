name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: What changed
    runs-on: ubuntu-latest
    outputs:
      fleet: ${{ steps.diff.outputs.fleet }}
    steps:
      # The PR's merge commit and its first parent (the base GitHub merged against).
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      # Fleet Planner's suite takes ~45 min on a macOS runner, so it only runs when a pull request touches
      # 02-fleet-planner/, scripts/build-site.sh (its last step runs it) or this file. A manual run always runs it.
      - id: diff
        name: Does this change touch Fleet Planner?
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "fleet=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # --no-renames: a file moved out of 02-fleet-planner/ must list its old path too.
          files=$(git diff --no-renames --name-only HEAD^1 HEAD)
          echo "Changed files:"; echo "$files"
          if echo "$files" | grep -q -E '^(02-fleet-planner/|scripts/build-site\.sh$|\.github/workflows/ci\.yml$)'; then
            echo "fleet=true" >> "$GITHUB_OUTPUT"
          else
            echo "fleet=false" >> "$GITHUB_OUTPUT"
          fi

  site:
    name: Site build (every project)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: ./scripts/build-site.sh && test -f _site/index.html
      # Projects that moved to their own repo keep a forwarding page here.
      - run: grep -q 'spiro-12.github.io/silent-speech/' _site/01-silent-speech/index.html
      - run: grep -q 'github.com/Spiro-12/rokid-finder' _site/03-rokid-finder/index.html

  fleet:
    name: Fleet Planner (typecheck, unit, golden, e2e, build)
    needs: changes
    if: needs.changes.outputs.fleet == 'true'
    # Apple Silicon runner: its browsers get a (paravirtual) Metal GPU. Linux runners only have SwiftShader, which draws
    # the Phase 1 warehouse (SimReady world, about 500k triangles) too slowly for the e2e suite (> 30 min, timeouts).
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: 02-fleet-planner
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: 02-fleet-planner/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run typecheck
      - run: npx vitest run --project unit
      - run: npx vitest run --project golden --passWithNoTests
      # e2e builds the app, serves it gzipped like Pages, checks budgets (bytes, draw calls) and the
      # cross-engine determinism hash (Chromium, Firefox, WebKit vs Node). Real fps is measured on Spiro's Mac.
      - name: Which GPU the browser gets (for the log)
        run: >
          node -e "const {chromium}=require('playwright');(async()=>{const b=await chromium.launch({channel:'chromium'});const p=await b.newPage();
          console.log('WebGL renderer:',await p.evaluate(()=>{const g=document.createElement('canvas').getContext('webgl2');
          const e=g&&g.getExtension('WEBGL_debug_renderer_info');return g?g.getParameter(e?e.UNMASKED_RENDERER_WEBGL:g.RENDERER):'none'}));await b.close()})()"
      - run: npx playwright test
      - name: Pages build includes 02 with the right base path
        working-directory: .
        run: |
          ./scripts/build-site.sh
          test -f _site/02-fleet-planner/index.html
          grep -q '/weekend-projects/02-fleet-planner/assets/' _site/02-fleet-planner/index.html
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fleet-test-results
          path: 02-fleet-planner/test-results
          retention-days: 7
