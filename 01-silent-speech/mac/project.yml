# XcodeGen spec for the Silent Speech Mac bridge. Run `xcodegen` in this folder to make SilentSpeechBridge.xcodeproj.
# Build: xcodebuild -project SilentSpeechBridge.xcodeproj -target SilentSpeechBridge -configuration Debug build
# (CI adds CODE_SIGNING_ALLOWED=NO; Spiro's Mac adds CODE_SIGN_IDENTITY="SilentSpeech Local", see SETUP.md.)
name: SilentSpeechBridge
options:
  bundleIdPrefix: com.spiro
  developmentLanguage: en
targets:
  SilentSpeechBridge:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: SilentSpeechBridge
    settings:
      base:
        PRODUCT_NAME: SilentSpeechBridge
        PRODUCT_BUNDLE_IDENTIFIER: com.spiro.SilentSpeechBridge
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        ONLY_ACTIVE_ARCH: "NO" # command line builds have no active arch; build a universal app, no warning
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        INFOPLIST_FILE: SilentSpeechBridge/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        CODE_SIGN_ENTITLEMENTS: SilentSpeechBridge/SilentSpeechBridge.entitlements
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: "NO"
        ENABLE_APP_SANDBOX: "NO"
